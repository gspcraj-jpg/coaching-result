<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>রেজাল্ট ম্যানেজমেন্ট সিস্টেম</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --ink:#1c2521;
    --paper:#f7f5ef;
    --line:#d8d2c4;
    --accent:#2f6f4e;
    --accent-dark:#204d36;
    --gold:#b8863b;
    --danger:#a4392f;
    --muted:#6b6459;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans Bengali','SolaimanLipi',Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  .app{max-width:980px;margin:0 auto;padding:24px 18px 80px;}
  header.top{
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:3px solid var(--accent-dark);
    padding-bottom:14px;margin-bottom:22px;flex-wrap:wrap;gap:10px;
  }
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand input{
    font-size:22px;font-weight:700;border:none;background:transparent;
    color:var(--accent-dark);padding:2px 0;width:100%;
  }
  .brand small{color:var(--muted);}
  nav.tabs{display:flex;gap:8px;}
  nav.tabs button{
    border:1px solid var(--line);background:var(--card);
    padding:9px 16px;border-radius:8px;cursor:pointer;font-size:14px;
    color:var(--ink);font-weight:600;
  }
  nav.tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:20px;margin-bottom:18px;
  }
  h2{margin:0 0 14px;font-size:19px;color:var(--accent-dark);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media (max-width:640px){.grid,.grid3{grid-template-columns:1fr;}}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  input[type=text],input[type=number],input[type=date],select{
    width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;
    font-size:15px;background:#fff;color:var(--ink);font-family:inherit;
  }
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .field{margin-bottom:14px;}
  .btn{
    background:var(--accent);color:#fff;border:none;padding:11px 20px;
    border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .btn:hover{background:var(--accent-dark);}
  .btn.secondary{background:#fff;color:var(--accent-dark);border:1.5px solid var(--accent);}
  .btn.secondary:hover{background:#eef5f0;}
  .btn.small{padding:6px 12px;font-size:13px;}
  .btn.danger{background:var(--danger);}
  .btn.danger:hover{background:#832a22;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  table{width:100%;border-collapse:collapse;margin-top:6px;}
  th,td{border:1px solid var(--line);padding:9px 10px;text-align:left;font-size:14px;}
  th{background:#eef1ec;color:var(--accent-dark);font-weight:700;}
  tr:nth-child(even) td{background:#fafaf7;}
  td input[type=number]{width:90px;padding:6px 8px;}
  td input[type=text]{padding:6px 8px;}
  .rank-cell{font-weight:700;color:var(--accent-dark);}
  .absent{color:var(--muted);font-style:italic;}

  .muted{color:var(--muted);font-size:13px;}
  .row-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .empty{
    text-align:center;padding:40px 10px;color:var(--muted);border:1.5px dashed var(--line);
    border-radius:10px;
  }
  .date-folder{
    border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden;background:#fbfaf6;
  }
  .date-folder summary{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
    padding:12px 14px;cursor:pointer;font-size:14.5px;color:var(--accent-dark);font-weight:600;
    background:#eef1ec;list-style:none;
  }
  .date-folder summary::-webkit-details-marker{display:none;}
  .date-folder summary::before{content:"▸ ";}
  .date-folder[open] summary::before{content:"▾ ";}
  .folder-body{padding:12px 14px;}
  .exam-list-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 14px;border:1px solid var(--line);border-radius:9px;margin-bottom:9px;
    background:#fff;cursor:pointer;
  }
  .exam-list-item:hover{border-color:var(--accent);}
  .exam-list-item .meta{font-size:13px;color:var(--muted);margin-top:2px;}
  .tag{
    display:inline-block;background:#eef1ec;color:var(--accent-dark);
    font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;margin-right:6px;
  }
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--accent-dark);color:#fff;padding:11px 20px;border-radius:8px;
    font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:50;
  }
  .print-sheet{display:none;}

  @media print{
    body *{visibility:hidden;}
    .print-sheet,.print-sheet *{visibility:visible;}
    .print-sheet{display:block !important;position:absolute;top:0;left:0;width:100%;padding:20px;}
  }
  .ps-header-row{display:flex;align-items:center;gap:14px;border-bottom:3px solid #000;padding-bottom:10px;margin-bottom:14px;}
  .ps-logo{width:78px;height:78px;object-fit:contain;flex-shrink:0;}
  .ps-logo-spacer{width:78px;flex-shrink:0;}
  .ps-titleblock{flex:1;text-align:center;}
  .ps-titleblock h1{margin:0;font-size:30px;letter-spacing:.5px;}
  .ps-titleblock p{margin:6px 0 0;color:#222;font-size:15px;}
  .ps-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 24px;margin-bottom:16px;font-size:14px;}
  .ps-meta span b{color:#000;font-weight:700;}
  .ps-table{width:100%;border-collapse:collapse;}
  .ps-table th,.ps-table td{border:1px solid #333;padding:9px 10px;font-size:15px;text-align:center;}
  .ps-table th{background:#eee;font-weight:700;}
  .ps-table td.ps-name{text-align:left;}
  .ps-table td.ps-top{font-size:34px;font-weight:700;vertical-align:middle;}
  .ps-footer{display:flex;justify-content:flex-end;margin-top:40px;font-size:13px;}
  .ps-footer .sig{width:220px;text-align:center;}
  .ps-sign{display:block;height:42px;object-fit:contain;margin:0 auto 4px;}
  /* Force every bit of text on the printed sheet to pure black — near-black greys print faint/faded on laser printers */
  .print-sheet, .print-sheet *{color:#000 !important;}
  .ps-table td, .ps-table th{font-weight:600;}
  .sig-line{border-top:1px solid #333;padding-top:6px;}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="toastHost"></div>
<div class="print-sheet" id="pdfSheet"></div>

const API_URL = "https://script.google.com/macros/s/AKfycbz9ydabHjHQ6X0BbZKoUsMvF1G6q29XJF8SGfa9EePFXKdxnnMAZAkRF7Vp_cU7kQPHeg/exec";

const STORE = {
  async get(key, shared){
    const res = await fetch(`${API_URL}?action=get&key=${encodeURIComponent(key)}`);
    if(!res.ok) throw new Error('network error on get');
    const data = await res.json();
    if(!data.found) throw new Error('key not found');
    return { key: data.key, value: data.value, shared: !!shared };
  },
  async set(key, value, shared){
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'set', key, value })
    });
    if(!res.ok) throw new Error('network error on set');
    const data = await res.json();
    if(!data.success) throw new Error('save failed');
    return { key, value, shared: !!shared };
  },
  async delete(key, shared){
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'delete', key })
    });
    if(!res.ok) throw new Error('network error on delete');
    const data = await res.json();
    if(!data.success) throw new Error('delete failed');
    return { key, deleted:true, shared: !!shared };
  },
  async list(prefix, shared){
    const res = await fetch(`${API_URL}?action=list&prefix=${encodeURIComponent(prefix||'')}`);
    if(!res.ok) throw new Error('network error on list');
    const data = await res.json();
    return { keys: data.keys || [], prefix, shared: !!shared };
  }
};

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function sanitizeKey(s){ return (s||"").trim().replace(/[\s\/\\'"]+/g,'-'); }
function showToast(msg){
  const host=document.getElementById('toastHost');
  const t=el(`<div class="toast">${msg}</div>`);
  host.innerHTML=''; host.appendChild(t);
  setTimeout(()=>{ t.remove(); }, 2200);
}

async function loadSettings(){
  try{
    const r = await STORE.get('settings', true);
    if(r && r.value) SETTINGS = Object.assign({ centerName:"আমার কোচিং সেন্টার", adminPin:"" }, JSON.parse(r.value));
  }catch(e){ /* not set yet */ }
}
async function saveSettings(){
  try{ await STORE.set('settings', JSON.stringify(SETTINGS), true); }catch(e){ console.error(e); }
}

// Returns true if the correct admin PIN was entered (or set, if none exists yet).
async function verifyAdminPin(){
  if(!SETTINGS.adminPin){
    const setPin = prompt('এটাই প্রথমবার — মুছে ফেলার জন্য একটা এডমিন পিন সেট করুন (শুধু আপনি জানবেন, ৪ সংখ্যা বা তার বেশি):');
    if(!setPin || setPin.trim().length < 4){
      showToast('পিন সেট করা হয়নি, তাই মুছে ফেলা বাতিল হলো');
      return false;
    }
    SETTINGS.adminPin = setPin.trim();
    await saveSettings();
    showToast('এডমিন পিন সেট হয়েছে — এখন থেকে মুছে ফেলার সময় এটা চাইবে');
    return true;
  }
  const entered = prompt('মুছে ফেলার জন্য এডমিন পিন দিন:');
  if(entered === null) return false;
  if(entered.trim() !== SETTINGS.adminPin){
    showToast('পিন মিলছে না, মুছে ফেলা বাতিল হলো');
    return false;
  }
  return true;
}

let FORM_META = { teachers:[], subjects:[], classes:[], sections:[], batches:[] };
async function loadFormMeta(){
  try{
    const r = await STORE.get('formMeta', true);
    if(r && r.value) FORM_META = Object.assign({teachers:[],subjects:[],classes:[],sections:[],batches:[]}, JSON.parse(r.value));
  }catch(e){ /* not set yet */ }

async function updateFormMeta(ex){
  const addUnique = (arr, val) => { if(val && !arr.includes(val)) arr.push(val); };
  addUnique(FORM_META.teachers, ex.teacher);
  addUnique(FORM_META.subjects, ex.subject);
  addUnique(FORM_META.classes, ex.cls);
  addUnique(FORM_META.sections, ex.section);
  addUnique(FORM_META.batches, ex.batch);
  try{ await STORE.set('formMeta', JSON.stringify(FORM_META), true); }catch(e){ console.error(e); }
}
function datalistOptions(arr){

}

async function saveExam(exam){
  // if exam already has an id (editing an existing one), overwrite it in place; otherwise create a new one
  const id = exam.id || `${exam.classKey}_${sanitizeKey(exam.subject)}_${exam.date}_${Date.now()}`;
  exam.id = id;
  try{
    await STORE.set('exam:'+id, JSON.stringify(exam), true);
    await updateFormMeta(exam);
    return true;
  }catch(e){ console.error(e); return false; }
}

// dense ranking: equal marks -> equal rank; next distinct mark gets the very next rank number (no skipping)
// input: array of {name, mark}  (mark may be null/undefined/"" for absent)
function computeRanking(entryList){
  const present = entryList.filter(e => e.mark !== null && e.mark !== undefined && e.mark !== "" && e.name.trim()!=='');
  const absent = entryList.filter(e => (e.mark === null || e.mark === undefined || e.mark === "") && e.name.trim()!=='');
  present.sort((a,b)=> Number(b.mark) - Number(a.mark));
  let ranked = [];
  let prevMark = null, rankCounter = 0;
  present.forEach((e)=>{
    const numMark = Number(e.mark);
    if(prevMark === null || numMark !== prevMark){
      rankCounter += 1;
    }
    ranked.push({name:e.name, mark:numMark, rank:rankCounter});
    prevMark = numMark;
  });
  absent.forEach(e=> ranked.push({name:e.name, mark:null, rank:null}));
  ranked.sort((a,b)=>{
    if(a.rank===null && b.rank===null) return a.name.localeCompare(b.name,'bn');
    if(a.rank===null) return 1;
    if(b.rank===null) return -1;
    return a.rank - b.rank;
  });
  return ranked;
}

// ---- Bengali numeral / ordinal helpers ----
const BN_DIGITS = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
function toBnDigits(input){
  return String(input).replace(/[0-9]/g, d => BN_DIGITS[d]);
}
const BN_ORDINAL_SUFFIX = {1:'ম',2:'য়',3:'য়',4:'র্থ',5:'ম',6:'ষ্ঠ',7:'ম',8:'ম',9:'ম',10:'ম'};
function toBnOrdinal(n){
  if(n===null || n===undefined) return '-';
  if(n<=10) return toBnDigits(n)+BN_ORDINAL_SUFFIX[n];
  return toBnDigits(n)+'তম';
}

async function goToStudentsStep(){
  const ex = currentExam;
  if(!ex.teacher || !ex.subject || !ex.cls || !ex.date){
    showToast('অনুগ্রহ করে * চিহ্নিত ঘরগুলো পূরণ করুন');
    return;
  }
  ex.classKey = sanitizeKey(`${ex.cls}-${ex.section}-${ex.batch}`);
  if(ex.editing && ex.entries && ex.entries.length){
    // editing an existing result — keep its already-loaded names/marks, don't overwrite from the master list
    ex.step = 'students';
    render();
    return;
  }
  const existing = await getStudents(ex.classKey);
  ex.entries = existing.length ? existing.map(n=>({name:n, mark:null})) : [];
  ex.step = 'students';
  render();
}

function formatBnDate(dateStr){
  if(!dateStr) return '';
  const [y,m,d] = dateStr.split('-');
  return toBnDigits(`${d}/${m}/${y}`);
}

// Computes a table font-size (and matching cell padding) so that, whether there are
// 5 students or 60, the printed table fills roughly the same page height — few students
// means noticeably BIGGER text, not wasted blank space at the bottom of the page.
function computeDynamicTableStyle(rowCount){
  const targetTableHeightPx = 760; // approx. usable table-body height on one A4 page at our fixed 780px sheet width
  const effectiveRows = rowCount + 1; // + header row
  const rowHeightPx = targetTableHeightPx / effectiveRows;
  let fontPx = rowHeightPx / 2.15; // empirical: rowHeight ≈ fontSize * 2.15 given our padding/line-height
  fontPx = Math.max(9, Math.min(30, fontPx));
  const padV = Math.round(fontPx * 0.32);
  const padH = Math.round(fontPx * 0.42);
  return { fontPx: fontPx.toFixed(1), padV, padH };
}

function printSheetHtml(ex, ranking){
  const topMark = ranking.length && ranking[0].mark!==null ? toBnDigits(ranking[0].mark) : '';
  const rowCount = ranking.length || 1;
  const ts = computeDynamicTableStyle(rowCount);
  const rows = ranking.map((r,i)=>`
    <tr>
      <td>${toBnDigits(String(i+1).padStart(2,'0'))}</td>
      <td class="ps-name">${r.name}</td>
      <td>${r.mark!==null ? toBnDigits(r.mark) : 'অনুপস্থিত'}</td>
      <td>${toBnOrdinal(r.rank)}</td>
      ${i===0 ? `<td class="ps-top" rowspan="${rowCount}">${topMark}</td>` : ''}
    </tr>
  `).join('');

  const sectionLine = `${ex.cls}${ex.section ? ' ('+ex.section+')' : ''}${ex.batch ? ' — '+ex.batch : ''} শাখার পরীক্ষার ফলাফল`;

  return `
    <style>
      .ps-table th, .ps-table td{ font-size:${ts.fontPx}px !important; padding:${ts.padV}px ${ts.padH}px !important; }
      .ps-table td.ps-top{ font-size:${(ts.fontPx*2.2).toFixed(1)}px !important; }
    </style>
    <div class="ps-header-row">
      <img class="ps-logo" src="data:image/jpeg;base64,${LOGO_B64}" alt="logo"/>
      <div class="ps-titleblock">
        <h1>${SETTINGS.centerName}</h1>
        <p>${sectionLine}</p>
      </div>
      <div class="ps-logo-spacer"></div>
    </div>
    <div class="ps-meta">
      <span>বিষয়ঃ <b>${ex.subject}</b></span>
      <span>তারিখঃ <b>${formatBnDate(ex.date)}</b></span>
      <span>পূর্ণমানঃ <b>${toBnDigits(ex.fullMarks)}</b></span>
      <span>নিরীক্ষক:- <b>${ex.teacher}</b></span>
    </div>
    <table class="ps-table">
      <thead>
        <tr>
          <th style="width:70px;">ক্রমিক নং</th>
          <th>শিক্ষার্থীর নাম</th>
          <th style="width:110px;">প্রাপ্ত নাম্বার</th>
          <th style="width:110px;">মেধাস্থান</th>
          <th style="width:110px;">সর্বোচ্চ নম্বর</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="ps-footer">
      <div class="sig">
        <img class="ps-sign" src="data:image/png;base64,${SIGNATURE_B64}" alt="signature"/>
        <div class="sig-line">পরিচালক</div>
      </div>
    </div>
  `;
}

// Renders one exam's result sheet off-screen into the persistent #pdfSheet container and
// returns the rendered canvas. Works regardless of which view is currently on screen.
async function renderExamToCanvas(ex){
  const ranking = computeRanking(ex.entries);
  const sheet = document.getElementById('pdfSheet');
  sheet.innerHTML = printSheetHtml(ex, ranking);
  const prevStyle = sheet.getAttribute('style') || '';
  sheet.style.display = 'block';
  sheet.style.position = 'fixed';
  sheet.style.top = '0';
  sheet.style.left = '-10000px';
  sheet.style.width = '780px';
  sheet.style.background = '#ffffff';
  sheet.style.padding = '24px';
  sheet.style.zIndex = '-1';
  await new Promise(r=>setTimeout(r,60));
  const canvas = await html2canvas(sheet, {scale:2, backgroundColor:'#ffffff', useCORS:true});
  sheet.setAttribute('style', prevStyle);
  sheet.innerHTML = '';
  return canvas;
}

// Adds one exam's canvas to a jsPDF document, scaled to fit a single page.
function addExamCanvasToPdf(pdf, canvas, imgData, isFirstPageOfDoc){
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const ratio = Math.min((pageWidth-40)/canvas.width, (pageHeight-40)/canvas.height);
  const imgW = canvas.width*ratio;
  const imgH = canvas.height*ratio;
  if(!isFirstPageOfDoc) pdf.addPage();
  pdf.addImage(imgData, 'JPEG', (pageWidth-imgW)/2, 20, imgW, imgH);
}

async function downloadPDF(ex){
  try{
    const canvas = await renderExamToCanvas(ex);
    const imgData = canvas.toDataURL('image/jpeg', 0.95);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','pt','a4');
    addExamCanvasToPdf(pdf, canvas, imgData, true);
    // add a second, identical page — lets you print "2 pages per sheet" and cut once for 2 copies at half the paper cost
    addExamCanvasToPdf(pdf, canvas, imgData, false);
    const fname = `${sanitizeKey(ex.cls)}_${sanitizeKey(ex.subject)}_${ex.date}.pdf`;
    pdf.save(fname);
  }catch(err){
    console.error(err);
    showToast('PDF তৈরিতে সমস্যা হয়েছে, আবার চেষ্টা করুন');
  }
}

// Downloads every exam in examList as ONE combined PDF (each result still duplicated onto
// 2 pages for economical "2 pages per sheet" printing). Used for the date "folder" bulk-download.
// Downloads every exam in examList as a ZIP file containing one separate PDF per result
// (each PDF still duplicated onto 2 pages for economical "2 pages per sheet" printing).
async function downloadBulkPDF(examList, filenameBase, progressBtn){
  if(!examList.length){ showToast('কোনো রেজাল্ট নেই'); return; }
  try{
    const { jsPDF } = window.jspdf;
    const zip = new JSZip();
    const usedNames = new Set();
    for(let i=0;i<examList.length;i++){
      if(progressBtn) progressBtn.textContent = `তৈরি হচ্ছে (${i+1}/${examList.length})...`;
      const ex = examList[i];
      const canvas = await renderExamToCanvas(ex);
      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      const pdf = new jsPDF('p','pt','a4');
      addExamCanvasToPdf(pdf, canvas, imgData, true);
      addExamCanvasToPdf(pdf, canvas, imgData, false);
      const blob = pdf.output('blob');
      const baseName = `${sanitizeKey(ex.cls)}_${sanitizeKey(ex.subject)}_${ex.date}`;
      let finalName = baseName, n = 1;
      while(usedNames.has(finalName)){ n++; finalName = `${baseName}_${n}`; }
      usedNames.add(finalName);
      zip.file(`${finalName}.pdf`, blob);
    }
    if(progressBtn) progressBtn.textContent = 'ZIP তৈরি হচ্ছে...';
    const zipBlob = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${filenameBase}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('ZIP ডাউনলোড সম্পন্ন হয়েছে');
  }catch(err){
    console.error(err);
    showToast('ZIP তৈরিতে সমস্যা হয়েছে, আবার চেষ্টা করুন');

  }
}

function attachResultEvents(root){
  const printBtn = root.querySelector('#printNow');
  if(printBtn) printBtn.addEventListener('click', async ()=>{
    printBtn.disabled = true;
    const orig = printBtn.textContent;
    printBtn.textContent = 'তৈরি হচ্ছে...';
    await downloadPDF(currentExam);
    printBtn.disabled = false;
    printBtn.textContent = orig;
  });
  const printBrowserBtn = root.querySelector('#printBrowser');
  if(printBrowserBtn) printBrowserBtn.addEventListener('click', ()=> window.print());
  const newOne = root.querySelector('#newOne');
  if(newOne) newOne.addEventListener('click', ()=>{ currentExam = blankExam(); VIEW='entry'; render(); });
  const toAdmin = root.querySelector('#toAdmin');
  if(toAdmin) toAdmin.addEventListener('click', ()=>{ VIEW='admin'; render(); });
}

function parseExamKey(key){
  // exam:{classKey}_{subject}_{date}_{timestamp}
  const raw = key.replace(/^exam:/,'');
  const parts = raw.split('_');
  const ts = parts.pop();
  const date = parts.pop();
  const subject = parts.pop();
  const classKey = parts.join('_');
  return {key, classKey, subject, date, ts};
}

function renderAdmin(){
  const wrap = el(`
    <div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px;">
          <h2 style="margin:0;">সংরক্ষিত রেজাল্টসমূহ (তারিখ অনুযায়ী)</h2>
          <button class="btn small secondary" id="downloadAllBtn">📦 সব রেজাল্ট ZIP আকারে ডাউনলোড করুন</button>
        </div>
        <div id="examListHost"><p class="muted">লোড হচ্ছে...</p></div>
      </div>
    </div>
  `);
  const host = wrap.querySelector('#examListHost');
  renderAdminInto(host);
  const downloadAllBtn = wrap.querySelector('#downloadAllBtn');
  downloadAllBtn.addEventListener('click', async ()=>{
    downloadAllBtn.disabled = true;
    const orig = downloadAllBtn.textContent;
    const keys = await listExamKeys();
    const parsed = keys.map(parseExamKey).sort((a,b)=> Number(b.ts)-Number(a.ts));
    const exams = [];
    for(const p of parsed){
      const data = await getExam(p.key.replace(/^exam:/,''));
      if(data) exams.push(data);
    }
    await downloadBulkPDF(exams, 'সব-রেজাল্ট', downloadAllBtn);
    downloadAllBtn.disabled = false;
    downloadAllBtn.textContent = orig;
  });
  return wrap;
}

// Re-loads and re-renders the exam list, grouped into date "folders" with bulk-download buttons.
// Used for the initial admin view load and after deleting/editing an item.
async function renderAdminInto(host){
  host.innerHTML = '<p class="muted">লোড হচ্ছে...</p>';
  const keys = await listExamKeys();
  if(!keys.length){
    host.innerHTML = `<p class="empty">এখনো কোনো রেজাল্ট সংরক্ষিত হয়নি।</p>`;
    return;
  }
  const parsed = keys.map(parseExamKey).sort((a,b)=> Number(b.ts)-Number(a.ts));

  // group by date
  const byDate = new Map();
  parsed.forEach(p=>{
    if(!byDate.has(p.date)) byDate.set(p.date, []);
    byDate.get(p.date).push(p);
  });
  const dates = Array.from(byDate.keys()).sort((a,b)=> a<b ? 1 : -1); // newest date first

  host.innerHTML = '';
  dates.forEach((date, idx)=>{
    const itemsForDate = byDate.get(date);
    const folder = el(`
      <details class="date-folder" ${idx===0 ? 'open' : ''}>
        <summary>
          <span>📅 <b>${formatBnDate(date)}</b> — ${toBnDigits(itemsForDate.length)}টি রেজাল্ট</span>
          <button class="btn small secondary" data-bulk-date="${date}">📦 সব ডাউনলোড (ZIP)</button>
        </summary>
        <div class="folder-body" data-body-date="${date}"></div>
      </details>
    `);
    const body = folder.querySelector('.folder-body');
    itemsForDate.forEach(p=>{
      const item = el(`
        <div class="exam-list-item" data-key="${p.key}">
          <div>
            <div><span class="tag">${p.classKey.replace(/-/g,' ')}</span><b>${p.subject}</b></div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <span class="muted" style="font-size:13px;">দেখুন / প্রিন্ট →</span>
            <button class="btn small secondary" data-edit-key="${p.key}" title="এডিট করুন">✎ এডিট</button>
            <button class="btn small danger" data-del-key="${p.key}" title="মুছে ফেলুন">✕ মুছুন</button>
          </div>
        </div>
      `);
      item.addEventListener('click', async (evt)=>{
        if(evt.target.closest('[data-del-key]') || evt.target.closest('[data-edit-key]')) return;
        const id = p.key.replace(/^exam:/,'');
        const data = await getExam(id);
        if(data){
          currentExam = data;
          VIEW = 'result';
          render();
        } else {
          showToast('রেজাল্ট লোড করা যায়নি');
        }
      });
      const editBtn = item.querySelector('[data-edit-key]');
      editBtn.addEventListener('click', async (evt)=>{
        evt.stopPropagation();
        const ok = await verifyAdminPin();
        if(!ok) return;
        const id = p.key.replace(/^exam:/,'');
        const data = await getExam(id);
        if(!data){ showToast('রেজাল্ট লোড করা যায়নি'); return; }
        data.editing = true;
        data.step = 'meta';
        currentExam = data;
        VIEW = 'entry';
        render();
      });
      const delBtn = item.querySelector('[data-del-key]');
      delBtn.addEventListener('click', async (evt)=>{
        evt.stopPropagation();
        const ok = await verifyAdminPin();
        if(!ok) return;
        const sure = confirm(`নিশ্চিত? এই রেজাল্টটি (${p.classKey.replace(/-/g,' ')} — ${p.subject} — ${p.date}) স্থায়ীভাবে মুছে যাবে।`);
        if(!sure) return;
        const id = p.key.replace(/^exam:/,'');
        const success = await deleteExam(id);
        if(success){
          showToast('রেজাল্ট মুছে ফেলা হয়েছে');
          renderAdminInto(host);
        } else {
          showToast('মুছতে সমস্যা হয়েছে, আবার চেষ্টা করুন');
        }
      });
      body.appendChild(item);
    });

    const bulkBtn = folder.querySelector('[data-bulk-date]');
    bulkBtn.addEventListener('click', async (evt)=>{
      evt.preventDefault();  // stop the <details> from toggling open/closed
      evt.stopPropagation();
      bulkBtn.disabled = true;
      const orig = bulkBtn.textContent;
      const exams = [];
      for(const p of itemsForDate){
        const data = await getExam(p.key.replace(/^exam:/,''));
        if(data) exams.push(data);
      }
      await downloadBulkPDF(exams, `রেজাল্ট-${date}`, bulkBtn);
      bulkBtn.disabled = false;
      bulkBtn.textContent = orig;
    });

    host.appendChild(folder);
  });
}

async function init(){
  const app = document.getElementById('app');
  app.innerHTML = `<div style="text-align:center;padding:60px 10px;color:var(--muted);">লোড হচ্ছে...</div>`;
  await Promise.all([loadSettings(), loadFormMeta()]);
  render();
}

const origRender = render;
render = function(){
  origRender();
  const app = document.getElementById('app');
  attachHomeEvents(app);
  attachEntryEvents(app);
  attachResultEvents(app);
};

init();
</script>
